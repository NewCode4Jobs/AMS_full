# pyproject.toml
[project]
name = "alarm-management-system"
version = "0.1.0"
description = "Alarm Management System"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "motor>=3.3.2",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "black>=23.12.1",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "httpx",
    "pytest-asyncio"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv.scripts]
dev-backend = "uvicorn backend.app_fastapi.main:app --reload --port 8000"
dev-frontend-vanilla = "python -m http.server --bind=0.0.0.0:3000"
dev-frontend-react = "cd frontend/app_react && npm run dev"
format = "black backend tests"
lint = "mypy backend tests"
test = "pytest tests"