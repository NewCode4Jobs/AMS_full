<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">AMS</a>
                </div>
            </nav>
        </header>

        <!-- Sidebar -->
        <aside class="app-sidebar bg-dark text-white">
            <div class="p-3">
                <h5>Navigation</h5>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            <i class="bi bi-bell-fill"></i> Alarms
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Filters Section -->
            <section class="filters-section">
                <div class="card">
                    <div class="card-body" id="alarmFilters">
                        <h5 class="card-title mb-4">Filters</h5>
                        <form id="filterForm">
                            <div class="mb-3">
                                <label class="form-label">Search</label>
                                <input type="text" class="form-control" name="search" placeholder="Search by name or description">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Severity</label>
                                <select class="form-select" name="severity">
                                    <option value="">All Severities</option>
                                    <option value="critical">Critical</option>
                                    <option value="high">High</option>
                                    <option value="medium">Medium</option>
                                    <option value="low">Low</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-select" name="status">
                                    <option value="">All Statuses</option>
                                    <option value="active">Active</option>
                                    <option value="acknowledged">Acknowledged</option>
                                    <option value="resolved">Resolved</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Source</label>
                                <select class="form-select" name="source">
                                    <option value="">All Sources</option>
                                    <option value="system">System</option>
                                    <option value="application">Application</option>
                                    <option value="security">Security</option>
                                </select>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Grid Section -->
            <section class="grid-section">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="card-title mb-0">Alarms</h5>
                            <button class="btn btn-primary btn-sm" id="newAlarmBtn">
                                <i class="bi bi-plus-lg me-1"></i>
                                New Alarm
                            </button>
                        </div>
                        <div id="alarmGrid" class="alarm-grid"></div>
                    </div>
                </div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section">
                <div class="card">
                    <div class="card-body" id="alarmStats">
                        <h5 class="card-title mb-4">Statistics</h5>
                        <div class="row g-3" id="statsContent">
                            Loading stats...
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for Create/Edit Alarm -->
    <div class="modal fade" id="alarmModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="alarmModalTitle">New Alarm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="alarmForm">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Severity</label>
                            <select class="form-select" name="severity" required>
                                <option value="critical">Critical</option>
                                <option value="high">High</option>
                                <option value="medium">Medium</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Source</label>
                            <select class="form-select" name="source" required>
                                <option value="system">System</option>
                                <option value="application">Application</option>
                                <option value="security">Security</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveAlarmBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/alarms.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
